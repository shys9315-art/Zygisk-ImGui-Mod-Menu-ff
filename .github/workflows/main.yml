name: Build Zygisk Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Make Gradle Executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew :module:assembleRelease

    - name: Upload Compiled Module ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Zygisk-ImGui-Menu-FreeFire
        path: out/*.zip
