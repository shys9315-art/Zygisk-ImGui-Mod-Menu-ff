name: Build Fixed Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Manually Download ImGui Source
      run: |
        git clone --depth 1 https://github.com/ocornut/imgui.git /tmp/imgui
        mkdir -p module/src/main/cpp/Includes/imgui
        cp /tmp/imgui/*.h module/src/main/cpp/Includes/imgui/
        cp /tmp/imgui/*.cpp module/src/main/cpp/Includes/imgui/
        cp -r /tmp/imgui/backends module/src/main/cpp/Includes/imgui/

    - name: Make Gradle Executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew :module:assembleRelease

    - name: Upload Compiled Module ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Zygisk-ImGui-Menu-FreeFire
        path: out/*.zip
        
